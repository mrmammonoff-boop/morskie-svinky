<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐹 Мир морских свинок</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fffaf5;
  color:#333;
  line-height:1.6;
}

nav{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  padding:14px 6%;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.nav-inner{
  max-width:1150px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#513c31;
}

.logo span{
  color:#d8895d;
}

nav a{
  text-decoration:none;
  color:#513c31;
  margin-left:18px;
  font-weight:600;
}

nav a:hover{
  color:#d16d3f;
}

.hero{
  max-width:1150px;
  margin:auto;
  padding:70px 6% 50px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  align-items:center;
}

.hero h1{
  font-size:clamp(42px,7vw,72px);
  line-height:1.05;
  margin:0 0 20px;
  color:#513c31;
}

.hero p{
  font-size:20px;
  color:#6d625c;
}

.hero img{
  width:100%;
  height:420px;
  object-fit:cover;
  border-radius:30px;
  box-shadow:0 20px 50px rgba(80,50,30,.18);
}

.btn{
  display:inline-block;
  background:#d8895d;
  color:white;
  padding:13px 22px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  margin-top:10px;
}

section{
  max-width:1150px;
  margin:auto;
  padding:70px 6%;
}

h2{
  font-size:40px;
  color:#513c31;
  margin-top:0;
}

h3{
  color:#513c31;
}

.section-intro{
  color:#70645d;
  max-width:750px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.card{
  background:white;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(70,45,30,.09);
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
}

.card-content{
  padding:20px;
}

.card-content p{
  color:#6f655f;
}

.info{
  background:#f4e5d7;
  border-radius:28px;
  padding:35px;
}

.info ul{
  padding-left:22px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.fact{
  background:#fff;
  border-left:6px solid #d8895d;
  padding:22px;
  border-radius:15px;
